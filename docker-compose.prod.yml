# Override de producción para el servidor de la empresa.
# Uso en servidor:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up --build -d
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - NODE_ENV=production
    # Sin bind mount de código ni node_modules anónimo: usa dist/ de la imagen
    volumes: !override
      - uploads_data:/app/uploads
    # Usa el CMD de la imagen (node dist/main), no start:dev
    command: !reset null
    ports: !override
      - "${PORT:-3000}:${PORT:-3000}"
    networks:
      - nestjs-network
      - crm-network
    restart: unless-stopped

  mysql:
    # No exponer MySQL al host en producción, solo red interna
    # Quita el bind de ./database/init (solo dev) y conserva el volumen de datos
    ports: !override []
    volumes: !override
      - mysql_data:/var/lib/mysql
    networks:
      - nestjs-network
    restart: unless-stopped

  redis:
    ports: !override []
    networks:
      - nestjs-network
    restart: unless-stopped

  # phpmyadmin queda fuera en prod salvo que lo actives con --profile tools
  phpmyadmin:
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - nestjs-network
    restart: unless-stopped

volumes:
  uploads_data:

networks:
  crm-network:
    name: crm-network
    driver: bridge
